[project]
name = "zero-trust-rag"
version = "0.1.0"
description = "Multi-tenant RAG API where access control is enforced by PostgreSQL Row-Level Security."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
# Real local embeddings (pulls in onnxruntime). Tests and CI use FakeEmbedder
# and do not need this. Install with: uv sync --extra embeddings
embeddings = ["fastembed>=0.4"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test; fixed test UUIDs are not secrets; seeded RNG is
# deliberate (deterministic embeddings); table names in f-strings are constants.
"tests/**" = ["S101", "S105", "S106", "S311", "S608"]
# Scripts build SQL from migration files on disk, not from user input.
"scripts/**" = ["S608"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
